# Socle local : Keycloak (+ sa base PostgreSQL) + base MySQL du portail
# Usage : docker compose -f infra/docker-compose.yml up -d
# NB : Docker Desktop doit être installé sur le poste.
#     Alternative sans Docker : MySQL Server local + MySQL Workbench, puis
#     exécuter infra/db/portail_db.sql (voir docs/08-base-de-donnees.md).

services:
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: portail-postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: change-me-local
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-portail:
    image: mysql:8.4
    container_name: portail-mysql-app
    environment:
      MYSQL_DATABASE: portail_db
      MYSQL_USER: portail_app
      MYSQL_PASSWORD: change-me-local
      MYSQL_ROOT_PASSWORD: change-me-local-root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - portail-db:/var/lib/mysql
      # Scripts joués au premier démarrage (ordre alphabétique) :
      - ./db/portail_db.sql:/docker-entrypoint-initdb.d/01-portail_db.sql:ro
      - ./db/donnees-demo.sql:/docker-entrypoint-initdb.d/02-donnees-demo.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: portail-keycloak
    command: start-dev --import-realm
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: change-me-local
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: change-me-local
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8081:8080"

volumes:
  keycloak-db:
  portail-db:
