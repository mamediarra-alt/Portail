# Socle local : Keycloak + PostgreSQL
# Usage : docker compose -f infra/docker-compose.yml up -d
# NB : Docker Desktop doit être installé sur le poste.

services:
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: portail-postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: change-me-local
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-portail:
    image: postgres:16-alpine
    container_name: portail-postgres-app
    environment:
      POSTGRES_DB: portail
      POSTGRES_USER: portail
      POSTGRES_PASSWORD: change-me-local
    volumes:
      - portail-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portail"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: portail-keycloak
    command: start-dev --import-realm
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: change-me-local
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: change-me-local
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8081:8080"

volumes:
  keycloak-db:
  portail-db:
