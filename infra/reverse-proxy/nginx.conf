# =============================================================================
#  Portail Applicatif du Ministère — reverse proxy de production (Nginx)
#
#  Rôle : point d'entrée réseau unique.
#   - termine TLS (HTTPS partout) et redirige HTTP -> HTTPS ;
#   - sert la SPA Angular (build statique) ;
#   - relaie /api, /bff, /oauth2, /login/oauth2 vers le BFF ;
#   - un sous-domaine par application (portal / ecole / restaurant) ;
#   - en-têtes de sécurité, journalisation, rate limiting.
#
#  Traefik convient aussi (mêmes principes, config déclarative par labels).
# =============================================================================

# -- Zones de limitation de débit -------------------------------------------
limit_req_zone $binary_remote_addr zone=portail_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=portail_acces:10m   rate=5r/s;

# -- Redirection HTTP -> HTTPS ---------------------------------------------
server {
    listen 80;
    server_name portal.ministere.gouv ecole.ministere.gouv restaurant.ministere.gouv;
    return 308 https://$host$request_uri;
}

# -- Portail --------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name portal.ministere.gouv;

    ssl_certificate     /etc/nginx/tls/portal.crt;
    ssl_certificate_key /etc/nginx/tls/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # En-têtes de sécurité (le BFF les pose déjà ; on les fige au bord).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    client_max_body_size 2m;
    limit_req zone=portail_general burst=40 nodelay;

    # --- SPA Angular (fichiers statiques) ---
    root /var/www/portail-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Flux d'authentification et API : vers le BFF ---
    location ~ ^/(api|bff|oauth2|login/oauth2)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
    }

    # Limitation plus stricte sur le déclenchement d'accès.
    location = /api/acces/ { return 404; }
    location ~ ^/api/acces/ {
        limit_req zone=portail_acces burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/portail_access.log;
    error_log  /var/log/nginx/portail_error.log warn;
}

# -- Applications cibles (exemples ; propres à chaque application) ---------
server {
    listen 443 ssl;
    http2 on;
    server_name ecole.ministere.gouv;

    ssl_certificate     /etc/nginx/tls/ecole.crt;
    ssl_certificate_key /etc/nginx/tls/ecole.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8090;   # front + backend EDUSN (géré par son équipe)
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name restaurant.ministere.gouv;

    ssl_certificate     /etc/nginx/tls/restaurant.crt;
    ssl_certificate_key /etc/nginx/tls/restaurant.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8091;   # application Restaurant (PHP, gérée par son équipe)
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
