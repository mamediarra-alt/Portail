spring:
  application:
    name: portail-bff

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${PORTAIL_BFF_CLIENT_ID:portail-bff}
            client-secret: ${PORTAIL_BFF_CLIENT_SECRET:changer-ce-secret}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: ${PORTAIL_OIDC_ISSUER_URI:http://localhost:8081/realms/ministere}
            user-name-attribute: preferred_username

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - TokenRelay=
            - DedupeResponseHeader=Vary Access-Control-Allow-Origin Access-Control-Allow-Credentials
          routes:
            - id: portail-api
              uri: ${PORTAIL_API_URI:http://localhost:8082}
              predicates:
                - Path=/api/**
              filters:
                - RemoveRequestHeader=Cookie   # ne pas transmettre le cookie de session à l'API

server:
  port: ${PORTAIL_BFF_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    gouv.ministere.portail: INFO
    org.springframework.security: INFO
